<div class="chatbot">
  <div class="chatbot__messages">
    @for (message of messages(); track $index) {
    <div
      class="chatbot__message"
      [class.chatbot__message--user]="message.role === 'user'"
    >
      {{ message.content }}
    </div>
    }
  </div>

  <div class="chatbot__input">
    <input
      nz-input
      placeholder="Ask an interview question..."
      [ngModel]="draftQuestion()"
      (ngModelChange)="draftQuestion.set($event)"
      (keydown.enter)="askQuestion()"
      [disabled]="isAsking()"
    />
    <button (click)="askQuestion()" [disabled]="isAsking()">Send</button>
  </div>
</div>
